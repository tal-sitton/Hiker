<!DOCTYPE html>
<html lang="he">
<head>
    <link rel="icon" href="favicon.png" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>הייקר - מפת טיולים</title>
    <meta name="description" content="מפת טיולים אינטראקטיבית למציאת מסלולים בישראל">

    <meta property="og:type" content="website">
    <meta property="og:title" content="הייקר - מפת טיולים">
    <meta property="og:description" content="מפת טיולים אינטראקטיבית למציאת מסלולים בישראל">
    <meta property="og:image" content="https://hiker.sitton.dev/favicon.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <link rel="stylesheet" href="styles.css?v=20261017-smooth-collapse-v8">
</head>
<body>
    <div class="container">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <img src="favicon.png" alt="לוגו" class="logo" width="50px">
                <div class="brand-lockup">
                    <h1>הייקר - טיולים</h1>
                    <span>מפת מסלולים בישראל</span>
                </div>
                <button id="minimizeBtn" class="minimize-btn" title="הסתר סרגל צד" aria-label="הסתר סרגל צד"><span class="collapse-icon" aria-hidden="true"></span></button>
            </div>

            <div class="mobile-tabs">
                <button class="tab-btn active" onclick="switchTab('filters')">מסננים</button>
                <button class="tab-btn" onclick="switchTab('hikes')">טיולים</button>
            </div>

            <div class="filter-section" id="filtersTab">
                <div class="filters-overview">
                    <div>
                        <span class="filters-eyebrow">חיפוש ממוקד</span>
                        <h2>מסננים</h2>
                    </div>
                    <span id="activeFilterCount" class="active-filter-count">0 פעילים</span>
                </div>
                <div id="filterSummary" class="filter-summary" aria-live="polite">
                    <span>כל הטיולים מוצגים</span>
                </div>
                <div class="section-header" onclick="toggleSection('lengthSection')">
                    <h3>אורך (ק"מ)</h3>
                    <span class="toggle-icon">▼</span>
                </div>
                <div id="lengthSection" class="section-content">
                    <div class="range-slider">
                        <input type="range" id="lengthMin" min="0" max="100" value="0">
                        <input type="range" id="lengthMax" min="0" max="100" value="100">
                        <div class="range-slider-track"></div>
                    </div>
                    <div class="range-inputs">
                        <label>
                            <span>מינימום</span>
                            <input type="number" id="lengthMinInput" min="0" value="0" inputmode="decimal">
                        </label>
                        <label>
                            <span>מקסימום</span>
                            <input type="number" id="lengthMaxInput" min="0" value="100" inputmode="decimal">
                        </label>
                    </div>
                    <div class="length-display">
                        <span id="lengthDisplay">0 - 100</span> ק"מ
                    </div>
                </div>

                <div class="section-header" onclick="toggleSection('tagsSection')">
                    <h3>תגיות</h3>
                    <span class="toggle-icon">▼</span>
                </div>
                <div id="tagsSection" class="section-content">
                    <div class="tag-logic-toggle">
                        <label>
                            <input type="radio" name="tagLogic" value="AND" checked onchange="applyFilters()">
                            <span>כל התגיות</span>
                        </label>
                        <label>
                            <input type="radio" name="tagLogic" value="OR" onchange="applyFilters()">
                            <span>אחת מהן</span>
                        </label>
                    </div>
                    <p class="tag-logic-help">בחרו אם המסלול צריך לכלול את כל התגיות או לפחות אחת מהן.</p>
                    <div id="tagFilter" class="tag-filter"></div>
                </div>

                <div class="filter-actions">
                    <button id="resetFilters" class="btn-reset">אפס מסננים</button>
                </div>
            </div>

            <div class="hikes-list" id="hikesTab">
                <h3>טיולים (<span id="hikeCount">0</span>)</h3>
                <div class="sort-controls">
                    <label for="sortBy">מיין לפי:</label>
                    <select id="sortBy" onchange="applyFilters()">
                        <option value="name">שם</option>
                        <option value="length">אורך</option>
                        <option value="difficulty">קושי</option>
                        <option value="north-south">צפון לדרום</option>
                    </select>
                </div>
                <ul id="hikesList"></ul>
            </div>
        </div>

        <button id="expandBtn" class="expand-btn" style="display: none;" title="הרחב סרגל צד"><span aria-hidden="true"></span></button>

        <div class="map-container">
            <div class="map-style-control" aria-label="בחירת סוג מפה">
                <label for="mapStyle">סוג מפה</label>
                <select id="mapStyle">
                    <option value="auto">אוטומטי</option>
                    <option value="osm">osm</option>
                    <option value="israel">מפת טיולים</option>
                </select>
            </div>
            <div id="mapStatus" class="map-status" role="status" aria-live="polite">טוען מסלולים...</div>
                <footer id="footer">
                    <span>נוצר על ידי טל סיטון | </span>
                    <a href="https://github.com/tal-sitton/Hiker" target="_blank">
                        <img src="https://img.shields.io/badge/github-%23121011.svg?style=for-the-badge&logo=github&logoColor=white"
                        alt="GitHub" width="70em" style="vertical-align: middle; border-radius: 5px;">
                    </a>
                    <a href="https://www.paypal.com/donate/?hosted_button_id=QFJWKB7U7Y8VL" target="_blank">
                        <img src="https://img.shields.io/badge/Donate-00457C?style=for-the-badge&logo=paypal&logoColor=white"
                        alt="Paypal" width="70em" style="vertical-align: middle; border-radius: 5px;">
                    </a>
                </footer>

            <div id="map"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

    <script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.17/leaflet-maplibre-gl.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="script.js?v=20261017-smooth-collapse-v8"></script>

    <!-- Cloudflare Web Analytics --><script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "3ca74af770f24b49b0bff960d9214e72"}'></script><!-- End Cloudflare Web Analytics -->
</body>
</html>
